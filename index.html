<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дневник Питания</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #1c1c1d; --card-bg: #2c2c2e; --text-color: #ffffff;
            --hint-color: #8e8e93; --accent-color: #0a84ff; --border-color: #3a3a3c;
        }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
        .nav-tabs { display: flex; background: var(--card-bg); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: var(--hint-color); font-size: 13px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: var(--accent-color); border-bottom: 3px solid var(--accent-color); }
        .container { padding: 10px; padding-bottom: 120px; }
        .section { display: none; }
        .section.active { display: block; }
        .meal-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .meal-title { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .group-header { font-size: 0.8rem; color: var(--hint-color); margin: 15px 0 8px; font-weight: bold; }
        .product-item {
            display: flex; justify-content: space-between; align-items: center; padding: 12px; 
            border: 1px solid var(--border-color); border-radius: 10px; background: var(--bg-color); 
            margin-bottom: 6px; transition: 0.2s; -webkit-tap-highlight-color: transparent;
        }
        .status-half { background: #ffd60a !important; color: #000; font-weight: bold; border-color: #ffd60a; }
        .status-full { background: #32d74b !important; color: #000; font-weight: bold; border-color: #32d74b; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: #fff; margin-top: 5px; box-sizing: border-box; font-size: 16px; }
        label { display: block; margin-top: 10px; color: var(--hint-color); font-size: 0.8rem; }
    </style>
</head>
<body>

<div class="nav-tabs">
    <button class="tab-btn active" id="btn-nutrition" onclick="showSection('nutrition')">Питание</button>
    <button class="tab-btn" id="btn-activity" onclick="showSection('activity')">Активность</button>
    <button class="tab-btn" id="btn-measurements" onclick="showSection('measurements')">Замеры</button>
</div>

<div class="container">
    <div id="nutrition" class="section active"><div id="food-app"></div></div>
    <div id="activity" class="section">
        <div class="meal-card"><div class="meal-title">Активность</div><label>Шаги</label><input type="number" id="steps"></div>
    </div>
    <div id="measurements" class="section">
        <div class="meal-card">
            <div class="meal-title">Замеры</div>
            <label>Вес (кг)</label><input type="number" id="m_weight" step="0.1">
            <label>Грудь (см)</label><input type="number" id="m_chest">
            <label>Талия (см)</label><input type="number" id="m_waist">
            <label>Бедра (см)</label><input type="number" id="m_hips">
        </div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.MainButton.text = "ОТПРАВИТЬ ОТЧЕТ";
    tg.MainButton.show();

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.getElementById('btn-' + id).classList.add('active');
    }

    const dietData = [
        {
            name: "1️⃣ Прием пищи",
            groups: [
                { id: "1а", title: "а) Сложные углеводы (~145 ккал)", items: [{n:"Бобовые",w:40},{n:"Картофель",w:140},{n:"Кукуруза свежая",w:140},{n:"Рис (не шлиф.)",w:40},{n:"Крупа любая",w:40},{n:"Ц/з мука",w:40},{n:"Хлебцы",w:60},{n:"Ц/з хлеб",w:65},{n:"Макароны тв.",w:40},{n:"Лаваш",w:60}] },
                { id: "1б", title: "б) Молочные продукты (~120 ккал)", items: [{n:"Творог 0.2%",w:160},{n:"Сыры",w:30},{n:"Сметана 15%",w:65},{n:"Кефир 1%",w:270},{n:"Йогурт 1%",w:250},{n:"Молоко 1%",w:280}] },
                { id: "1в", title: "в) Что угодно (~500 ккал)", items: [{n:"Что угодно/Снеки",w:100},{n:"Фрукты",w:1000},{n:"Бананы",w:600}] }
            ]
        },
        {
            name: "2️⃣ Прием пищи",
            groups: [
                { id: "2г", title: "г) Сложные углеводы (~145 ккал)", items: [{n:"Бобовые",w:40},{n:"Картофель",w:140},{n:"Кукуруза свежая",w:140},{n:"Рис (не шлиф.)",w:40},{n:"Крупа любая",w:40},{n:"Ц/з мука",w:40},{n:"Хлебцы",w:60},{n:"Ц/з хлеб",w:65},{n:"Макароны тв.",w:40},{n:"Лаваш",w:60}] },
                { id: "2д", title: "д) Белки (~195 ккал)", items: [{n:"Телятина",w:165},{n:"Печень",w:165},{n:"Филе птицы",w:175},{n:"Рыба до 5%",w:175},{n:"Рыба от 5%",w:140},{n:"2 яйца",w:1},{n:"Морепродукты",w:220}] },
                { id: "2е", title: "е) Овощи / Грибы (~60 ккал)", items: [{n:"Овощи/Зелень",w:300},{n:"Грибы",w:300}] },
                { id: "2ё", title: "ё) Жиры / Соусы (~90 ккал)", items: [{n:"Масло",w:10},{n:"Майонез",w:13},{n:"Авокадо",w:55},{n:"Оливки",w:70},{n:"Горчица",w:24},{n:"Кетчуп",w:36},{n:"Сало",w:9}] }
            ]
        },
        {
            name: "3️⃣ Прием пищи",
            groups: [
                { id: "3ж", title: "ж) Молочные (~130 ккал)", items: [{n:"Творог 0.2%",w:190},{n:"Сыры",w:40},{n:"Сметана 15%",w:75},{n:"Кефир 1%",w:330},{n:"Йогурт 1%",w:330},{n:"Молоко 1%",w:335}] },
                { id: "3з", title: "з) Фрукты и ягоды (~230 ккал)", items: [{n:"Фрукты/Ягоды",w:320},{n:"Банан/Виноград",w:190}] },
                { id: "3и", title: "и) Орехи / Семена (~110 ккал)", items: [{n:"Орехи/Семена",w:15}] }
            ]
        },
        {
            name: "4️⃣ Прием пищи",
            groups: [
                { id: "4и", title: "и) Белки (~195 ккал)", items: [{n:"Телятина",w:165},{n:"Печень",w:165},{n:"Филе птицы",w:175},{n:"Рыба до 5%",w:175},{n:"Рыба от 5%",w:140},{n:"2 яйца",w:1},{n:"Морепродукты",w:220}] },
                { id: "4й", title: "й) Овощи / Грибы (~60 ккал)", items: [{n:"Овощи/Зелень",w:300},{n:"Грибы",w:300}] },
                { id: "4к", title: "к) Жиры / Соусы (~90 ккал)", items: [{n:"Масло",w:10},{n:"Майонез",w:13},{n:"Авокадо",w:55},{n:"Оливки",w:70},{n:"Горчица",w:24},{n:"Кетчуп",w:36},{n:"Сало",w:9}] }
            ]
        }
    ];

    let eaten = JSON.parse(localStorage.getItem('eaten_vFinal')) || {};

    function eat(groupId, itemName) {
        const key = groupId + "_" + itemName;
        let groupTotal = 0;
        for (let k in eaten) { if (k.startsWith(groupId + "_") && k !== key) groupTotal += eaten[k]; }

        const cur = eaten[key] || 0;
        let next = 0;

        if (cur === 0) { if (groupTotal + 0.5 <= 1) next = 0.5; else return; }
        else if (cur === 0.5) { if (groupTotal + 1 <= 1) next = 1; else next = 0; }
        else { next = 0; }

        if (next === 0) delete eaten[key]; else eaten[key] = next;
        localStorage.setItem('eaten_vFinal', JSON.stringify(eaten));
        renderFood();
    }

    function renderFood() {
        const app = document.getElementById('food-app');
        let html = '';
        dietData.forEach(meal => {
            html += `<div class="meal-card"><div class="meal-title">${meal.name}</div>`;
            meal.groups.forEach(g => {
                html += `<div class="group-header"><span>${g.title}</span></div><div style="display:flex;flex-direction:column;gap:5px;">`;
                g.items.forEach(i => {
                    const val = eaten[g.id + "_" + i.n] || 0;
                    const cls = val === 0.5 ? 'status-half' : (val === 1 ? 'status-full' : '');
                    const label = val > 0 ? (val === 0.5 ? '½ порц.' : '1 порц.') : (i.w === 1 ? '' : i.w + 'г');
                    html += `<div class="product-item ${cls}" onclick="eat('${g.id}', '${i.n}')"><span>${i.n}</span><span>${label}</span></div>`;
                });
                html += `</div>`;
            });
            html += `</div>`;
        });
        app.innerHTML = html;
    }

  const inputs = ['steps', 'm_weight', 'm_chest', 'm_waist', 'm_hips'];
    inputs.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.value = localStorage.getItem(id) || "";
            el.oninput = () => localStorage.setItem(id, el.value);
        }
    });

    // 1. СЮДА МЫ ДОВАВИЛИ ВСТАВКУ ОКОШКА НА СТРАНИЦУ
    // Этот код сам создаст текстовое поле прямо перед кнопкой отправки!
    if (!document.getElementById('extra-input')) {
        const extraDiv = document.createElement('div');
        extraDiv.style = "margin: 20px 10px; text-align: left;";
        extraDiv.innerHTML = `
            <label for="extra-input" style="display:block; font-weight:600; margin-bottom:8px; color: #fff;">
                🗒 Дополнительно (продукты не из списка или срывы)
            </label>
            <textarea
                id="extra-input"
                rows="3"
                placeholder="Например: сорвалась на кусочек пиццы, съела 2 печенья..."
                style="width:100%; padding:12px; border:1px solid #ccc; border-radius:10px; font-size:14px; resize:vertical; box-sizing:border-box; background-color: #fff; color: #000;"
            ></textarea>
        `;
        // Вставляем окошко прямо перед кнопкой, если она есть, или просто в конец
        const appContainer = document.getElementById('food-app');
        if (appContainer) {
            appContainer.after(extraDiv);
        }
    }

    // 2. А ТЕПЕРЬ ОБНОВЛЕННАЯ ОТПРАВКА С УЧЕТОМ ЭТОГО ОКОШКА
    tg.MainButton.onClick(() => {
        let report = `📊 *ОТЧЕТ ЗА ${new Date().toLocaleDateString('ru-RU')}*\n\n`;
        report += `👣 Шаги: ${document.getElementById('steps').value || 0}\n⚖️ Вес: ${document.getElementById('m_weight').value || '-'} кг\n`;
        
        let foodStr = "\n🍎 *ЕДА:*";
        dietData.forEach(m => {
            m.groups.forEach(g => {
                g.items.forEach(i => {
                    const v = eaten[g.id + "_" + i.n] || 0;
                    if(v > 0) foodStr += `\n• ${i.n} (${v} порц.)`;
                });
            });
        });
        
        // Считываем то, что ты написала руками
        const extraText = document.getElementById('extra-input')?.value.trim() || '';
        if (extraText) {
            foodStr += `\n\n⚠️ *ДОПОЛНИТЕЛЬНО (срывы/перекусы):*\n${extraText}`;
        }
        
        tg.sendData(report + foodStr);
        localStorage.clear();
        
        // Очищаем и само текстовое поле после отправки
        const extraField = document.getElementById('extra-input');
        if (extraField) extraField.value = '';
    });
</script>
</body>
</html>
